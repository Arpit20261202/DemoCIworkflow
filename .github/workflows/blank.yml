name: Create Artifact

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create a file
        run: echo "Hello from GitHub Actions!" > artifact.txt

      - name: Upload Artifact-1
        uses: actions/upload-artifact@v4
        with:
          name: Artifact-1
          path: artifact.txt
